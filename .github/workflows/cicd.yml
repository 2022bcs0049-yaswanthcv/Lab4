name: Lab4 CI/CD - Train and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    outputs:
      mse: ${{ steps.read_metrics.outputs.mse }}
      r2: ${{ steps.read_metrics.outputs.r2 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Train model
        run: |
          python scripts/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          echo "mse=$(python -c "import json; print(json.load(open('artifacts/metrics.json'))['mse'])")" >> $GITHUB_OUTPUT
          echo "r2=$(python -c "import json; print(json.load(open('artifacts/metrics.json'))['r2'])")" >> $GITHUB_OUTPUT

      - name: Upload artifacts (model + metrics)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            artifacts/model.pkl
            artifacts/metrics.json

  deploy:
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts from train job
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: downloaded_artifacts

      # ✅ GATING STEP: decide improved or not
      - name: Decide if model improved
        id: gate
        run: |
          python - << 'PY'
          import json, os
          best_mse = float(os.environ["BEST_MSE"])
          current_mse = float(json.load(open("downloaded_artifacts/metrics.json"))["mse"])
          improved = current_mse < best_mse

          print(f"Baseline BEST_MSE: {best_mse}")
          print(f"Current MSE: {current_mse}")
          print(f"IMPROVED: {improved}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"improved={'true' if improved else 'false'}\n")
          PY
        env:
          BEST_MSE: ${{ vars.BEST_MSE }}

      # ✅ If NOT improved: print message and skip deploy steps
      - name: Metric did not improve (skip deployment)
        if: steps.gate.outputs.improved == 'false'
        run: |
          echo "2022BCS0049 ---- Metric did not improve, skipping deployment"

      # ✅ Deploy steps run ONLY when improved
      - name: Prepare model folder for Docker build
        if: steps.gate.outputs.improved == 'true'
        run: |
          mkdir -p model
          cp downloaded_artifacts/model.pkl model/model.pkl
          cp downloaded_artifacts/metrics.json model/metrics.json

      - name: Login to Docker Hub
        if: steps.gate.outputs.improved == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        if: steps.gate.outputs.improved == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            yash450987/yaswanth_2022bcs0049_lab4:latest
            yash450987/yaswanth_2022bcs0049_lab4:${{ github.sha }}

      - name: Update BEST_MSE variable
        if: steps.gate.outputs.improved == 'true'
        run: |
          echo "Updating BEST_MSE to ${{ needs.train.outputs.mse }}"
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/BEST_MSE \
            -d "{\"name\":\"BEST_MSE\",\"value\":\"${{ needs.train.outputs.mse }}\"}"
